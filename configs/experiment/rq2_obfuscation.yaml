# RQ2 — kháng obfuscation (ma trận held-out, phân tầng theo level)
inherit: configs/model/hipag_base.yaml
splits: experiments/dataset/splits.csv
seeds: [0, 1, 2, 3, 4]      # 5-seed, báo mean ± sd
report:
  metrics: [f1_macro, accuracy, precision, recall, mcc, pr_auc, fpr_at_tpr95]
  base_rate_precision: [0.10, 0.01, 0.001]   # RQF-07
  write_numbers_tex: paper/numbers.tex
eval_sets:
  obf_on_L0: {split: obf, where: {level: L0}}
  obf_on_L1: {split: obf, where: {level: L1}}
  obf_on_L2: {split: obf, where: {level: L2}}
  obf_on_L3: {split: obf, where: {level: L3}}
  obf_on_L4: {split: obf, where: {level: L4}}
  obf_on_L5: {split: obf, where: {level: L5}}
