model:
  name: hipag
  token_transformer: {d_embed: 64, heads: 4, layers: 2}      # tier 1
  intra_gatv2:       {hidden: 128, heads: 2, layers: 2}      # tier 2
  inter_transformer: {hidden: 128, heads: 2, layers: 2}      # tier 3 (TransformerConv/UniMP)
  taint_predictor:                                            # learned E_sem (RQF-06)
    mlp_hidden: 128
    tau: 0.5             # khởi tạo; hiệu chỉnh trên val mỗi epoch (max F1 cạnh)
    tau_floor: 0.3       # sàn của tau -> không giữ cặp xác suất thấp khi predictor còn yếu
    top_k: 8             # mỗi sink (đích) nhận ≤ top_k cạnh E_sem có p cao nhất
    warmup_epochs: 5     # epoch đầu: E_sem = luật (seed source->sink tới được), sau đó cạnh học được
    pos_weight: auto     # BCE cạnh: n_neg/n_pos mỗi batch; cần để tau_floor (ngưỡng tuyệt đối) có nghĩa
  global_features:   [shannon_entropy, has_eval, has_decode, has_var_func]
  dropout: 0.1
  pool: max            # global max-pool (giống H-GNN headline); mean-pool chỉ trong ablation
train:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 100
  batch_size: 32
  optimizer: adamw
